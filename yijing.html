<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171014" />
    <meta name="description" content="DAORA · 易经占卜。掷铜钱起六爻，或从六十四卦中抽一支签，皆在本地推算。" />
    <title>DAORA · 占卜 Yi Jing</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23271920'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23c7a76b' stroke-width='2'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='27' fill='%23d9c399'%3E道%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <div id="scene" aria-label="可交互的易经占卜三维场景"></div>
      <div class="scene-shade" aria-hidden="true"></div>

      <div id="loading" class="loading-screen">
        <div class="brand-seal">道</div>
        <span class="eyebrow">DAORA</span>
        <div class="loading-line"><span></span></div>
        <p data-i18n="loading">正在备下铜钱与卦签</p>
      </div>

      <section id="table-ui" class="table-ui hidden" aria-label="Yi jing controls">
        <header class="top-bar">
          <a class="brand" href="./index.html" aria-label="DAORA home">
            <span class="brand-seal small">道</span>
            <span><b>DAORA</b><small data-i18n="pageTitle">占卜</small></span>
          </a>
          <div class="top-actions">
            <button class="ghost-button" data-action="language" aria-label="Switch language"><span id="lang-label">EN</span></button>
            <button class="ghost-button icon" data-action="sound" aria-label="Toggle sound" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6 9H2v6h4l5 4V5z" />
                <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7" />
                <path class="wave" d="M18.4 5.6a9 9 0 0 1 0 12.8" />
              </svg>
            </button>
          </div>
        </header>

        <div class="table-copy">
          <span class="eyebrow"><span class="eyebrow-rule"></span><span data-i18n="kicker">YI JING DIVINATION</span></span>
          <h1 data-i18n="greeting">心有所问，卦有所答</h1>
          <div class="mode-tabs" role="tablist" aria-label="Divination method">
            <button class="mode-tab active" data-mode="coins" role="tab" aria-selected="true"><span data-i18n="tabCoins">摇卦 · 铜钱</span></button>
            <button class="mode-tab" data-mode="lot" role="tab" aria-selected="false"><span data-i18n="tabLot">抽签 · 卦签</span></button>
          </div>
        </div>

        <aside class="cast-panel" aria-live="polite">
          <input id="question" class="question-input" type="text" maxlength="60" data-i18n-placeholder="questionPlaceholder" placeholder="所问何事（可留空）" autocomplete="off" />
          <div class="panel-body">
            <div class="lines-wrap">
              <div id="lines" class="hex-lines" aria-label="卦画"></div>
              <p id="toss-status" class="toss-status"></p>
            </div>
            <div class="panel-text">
              <p id="panel-hint" class="panel-hint">连掷六次铜钱，卦象自下而上自成</p>
              <div id="result" class="result hidden">
                <span class="result-eyebrow">本卦</span>
                <b class="result-name"></b>
                <span class="result-sub"></span>
                <p class="result-judgment"></p>
                <p class="result-moving"></p>
                <p class="result-changed hidden"></p>
                <p class="result-tags"></p>
                <p class="engine-note" data-i18n="engineNote">卦名与卦辞出自本地太卜引擎推算结果</p>
              </div>
            </div>
          </div>
        </aside>

        <footer class="bottom-bar">
          <p class="hint"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="5"/><path d="M12 6v4"/></svg><span id="hint-tap">点击铜钱或下方按钮，掷出一爻</span></p>
          <button id="action" class="primary-button" type="button"><span>掷铜钱</span></button>
          <p class="disclaimer" data-i18n="disclaimer">仅供自我探索与文化体验，非专业建议</p>
        </footer>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"><span></span></div>
    </div>
    <script type="module" src="/src/yijing/main.js"></script>
  </body>
</html>
